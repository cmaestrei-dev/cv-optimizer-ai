name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Librerías del sistema para WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipos generados al día con web/openapi.json
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de producción
        run: docker build -t cv-optimizer .
      - name: Arranca y responde (API, web y PDF dentro del contenedor)
        run: |
          docker run -d --name app -p 8080:8080 -e AUTH_DEV_SECRET=$(python3 -c "print('x'*40)") -e AUTH_DEV_LOGIN=1 cv-optimizer
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf localhost:8080/api/health
          curl -sf localhost:8080/bandeja | grep -q 'id="root"'
          docker exec app python -c "from weasyprint import HTML; assert HTML(string='<p>Hola Árbol</p>').write_pdf().startswith(b'%PDF')"
          docker logs app 2>&1 | tail -20
